<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teaching Coach | Agent 1</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Prism.js for Code Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>Jarvus</span>
                </div>
                <div class="subtitle">Bilingual Teaching Coach</div>
            </div>

            <div class="sidebar-content">
                <!-- Fetch Today's Learning Log Button -->
                <button id="btn-starter-log" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-bolt"></i> Teach Today's Update
                </button>

                <hr class="divider" />

                <!-- Load File Form -->
                <div class="section-title">Study Repo File</div>
                <div class="form-group">
                    <label for="select-repo">Select Repository</label>
                    <select id="select-repo" class="form-control">
                        <option value="scraper-zepto-pdp">scraper-zepto-pdp</option>
                        <option value="scraper-myntra-pincode">scraper-myntra-pincode</option>
                        <option value="scraper-retail-pdp">scraper-retail-pdp</option>
                        <option value="RAG-PDF-CHATBOT">RAG-PDF-CHATBOT</option>
                        <option value="ml-prediction-models">ml-prediction-models</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="input-file-path">File Path</label>
                    <input type="text" id="input-file-path" class="form-control" placeholder="e.g., db_helper.py" value="db_helper.py" />
                </div>
                <button id="btn-load-file" class="btn btn-secondary btn-block">
                    <i class="fa-solid fa-file-code"></i> Load File to Chat
                </button>

                <hr class="divider" />

                <div class="section-title">Core Principles</div>
                <ul class="principles-list">
                    <li><i class="fa-solid fa-comments"></i> Natural Hinglish Explanations</li>
                    <li><i class="fa-solid fa-bars-staggered"></i> Line-by-Line Chunking</li>
                    <li><i class="fa-solid fa-lightbulb"></i> Analogies Before Jargon</li>
                    <li><i class="fa-solid fa-circle-question"></i> Understanding Checks ("samajh aaya?")</li>
                    <li><i class="fa-solid fa-rotate-left"></i> Active Recall Close</li>
                </ul>
            </div>

            <div class="sidebar-footer">
                <span class="user-info">
                    <i class="fa-brands fa-github"></i> @vivekrana-031122
                </span>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="active-topic-info">
                    <span class="topic-label">Currently Studying:</span>
                    <span id="active-topic-name">Hacker News Dashboard & SQLite Wrapper</span>
                </div>
                <div class="header-actions" style="display: flex; gap: 8px;">
                    <button id="btn-voice-toggle" class="btn-icon" title="Mute/Unmute Voice">
                        <i class="fa-solid fa-volume-xmark" id="voice-icon"></i>
                    </button>
                    <button id="btn-clear-chat" class="btn-icon" title="Clear Conversation">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </header>

            <!-- Chat Messages Feed -->
            <div id="chat-messages" class="chat-messages">
            </div>

            <!-- Chat Suggestions -->
            <div class="chat-suggestions">
                <button class="suggestion-tag" data-msg="Explain db_helper.py's fallback logic.">Explain SQLite Fallback</button>
                <button class="suggestion-tag" data-msg="Aaj humne kya kya build kiya? Summary do.">What did we build today?</button>
                <button class="suggestion-tag" data-msg="Explain the PYTHONPATH fix.">Explain PYTHONPATH</button>
            </div>

            <!-- Chat Input Footer -->
            <footer class="chat-footer">
                <form id="chat-form" class="chat-form">
                    <button type="button" id="btn-mic-toggle" class="btn-icon mic-btn" title="Speak to Jarvus">
                        <i class="fa-solid fa-microphone" id="mic-icon"></i>
                    </button>
                    <input type="text" id="chat-input" class="chat-input-field" placeholder="Ask anything about your code..." autocomplete="off" />
                    <button type="submit" class="chat-send-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
