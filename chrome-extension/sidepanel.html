<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Jarvus Assistant</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .header {
            padding: 10px 14px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .header span {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
        }
        input {
            flex-grow: 1;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 4px;
            color: #e2e8f0;
            padding: 4px 8px;
            font-size: 11px;
            outline: none;
        }
        input:focus {
            border-color: #6366f1;
        }
        button {
            background-color: #6366f1;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        button:hover {
            background-color: #4f46e5;
        }
        .container {
            flex-grow: 1;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>Connect:</span>
        <input type="text" id="server-url" value="https://ai-teaching-coach.onrender.com" />
        <button id="save-btn">Save</button>
    </div>
    <div class="container">
        <iframe id="chat-frame" src="about:blank" allow="microphone; clipboard-write;"></iframe>
    </div>
    <script src="sidepanel.js"></script>
</body>
</html>
